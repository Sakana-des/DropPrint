<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropPrint - Login Admin Penjual</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f3f5 0%, #e2e8f0 100%);
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .login-form {
            margin-top: 2rem;
            text-align: left;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }
        .input-wrapper {
            position: relative;
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(33, 93, 234, 0.15);
        }
        .error-alert {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #b91c1c;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .demo-badge {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 1.5rem;
            text-align: left;
            line-height: 1.4;
        }
        .back-to-home {
            margin-top: 1.5rem;
            display: block;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }
        .back-to-home:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card login-card text-center">
            <div class="logo" style="font-size: 2.2rem;">🖨️ DropPrint</div>
            <p class="subtitle">Masuk ke Dashboard Admin Penjual</p>

            <form id="loginForm" class="login-form">
                <!-- Alert Box untuk Error -->
                <div id="errorAlert" class="error-alert hidden">
                    <span>⚠️</span>
                    <span id="errorMessage">Username atau password salah!</span>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Masukkan password" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn primary-btn" style="padding: 12px; font-weight: 600;">Masuk Sekarang</button>
            </form>

            <div class="demo-badge">
                <strong>💡 Akun Demo Evaluasi:</strong><br>
                Username: <code style="font-weight: bold; background: #dbeafe; padding: 2px 4px; border-radius: 4px;">admin</code><br>
                Password: <code style="font-weight: bold; background: #dbeafe; padding: 2px 4px; border-radius: 4px;">admin123</code>
            </div>

            <a href="index.html" class="back-to-home">← Kembali ke Halaman Utama</a>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Validate credentials
            if (username === 'admin' && password === 'admin123') {
                // Success
                sessionStorage.setItem('adminLoggedIn', 'true');
                errorAlert.classList.add('hidden');
                
                // Show brief visual feedback before redirecting
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Menghubungkan...';
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Failure
                errorMessage.textContent = 'Username atau password salah. Silakan coba lagi!';
                errorAlert.classList.remove('hidden');
                
                // Add temporary shake animation or border color
                passwordInput.value = '';
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
